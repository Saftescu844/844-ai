name: Reviewed undici + fast-uri lockfile export (no deploy)

on:
  pull_request:
    branches:
      - security/sharp0355-remediation-20261013
    paths:
      - .github/workflows/undici-fasturi-export.yml

permissions:
  contents: write # temporary: only permitted for exact, verified destination branch

jobs:
  combined-security-smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/undici-fasturi-export-20261013'
    name: undici 7.29.1 plus fast-uri 3.1.8 on sharp 0.35.5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/ci"
      PAYLOAD_SECRET: "ci-only-placeholder-secret-not-for-runtime"
      MEDIA_PUBLIC_BASE_URL: "https://example.invalid/media"
      S3_BUCKET: "ci-only"
      S3_ACCESS_KEY_ID: "ci-only"
      S3_SECRET_ACCESS_KEY: "ci-only"
      S3_REGION: "eu-central-1"
      S3_ENDPOINT: "https://example.invalid"
      SITE_URL: "https://example.invalid"
      BREVO_API_KEY: "ci-not-used"
      ANTHROPIC_API_KEY: "ci-not-used"
      OPENAI_API_KEY: "ci-not-used"
    steps:
      - name: Checkout review branch, no write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22.17.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm
      - name: Generate both npm overrides in temporary runner only
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {readFileSync,writeFileSync} from 'node:fs'
          const pkg=JSON.parse(readFileSync('package.json','utf8'))
          assert.equal(pkg.dependencies.payload,'3.90.2')
          assert.equal(pkg.dependencies.sharp,'0.35.5')
          assert.equal(pkg.dependencies.next,'16.4.0')
          assert.equal(pkg.overrides,undefined)
          pkg.overrides={undici:'7.29.1','fast-uri':'3.1.8'}
          writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n')
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {readFileSync} from 'node:fs'
          const lock=JSON.parse(readFileSync('package-lock.json','utf8'))
          const wanted={
            'node_modules/undici':'7.29.1',
            'node_modules/fast-uri':'3.1.8',
            'node_modules/sharp':'0.35.5',
            'node_modules/payload':'3.90.2',
            'node_modules/next':'16.4.0',
          }
          for(const [path,v] of Object.entries(wanted)){
            assert.equal(lock.packages[path]?.version,v,path)
          }
          const paths=Object.keys(lock.packages).filter(p=>p.endsWith('/node_modules/undici')||p.endsWith('/node_modules/fast-uri'))
          for(const path of paths){
            assert.equal(lock.packages[path]?.version,path.endsWith('/undici')?'7.29.1':'3.1.8','unexpected nested package: '+path)
          }
          console.log('COMBINED_LOCK_OK',JSON.stringify(wanted))
          NODE
          git diff --stat -- package.json package-lock.json
      - name: Install combined dependency tree from temporary lockfile
        run: npm ci --no-audit --no-fund
      - name: Combined HTTP, AJV and sharp smoke tests (localhost only)
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import http from 'node:http'
          import {once} from 'node:events'
          import {createRequire} from 'node:module'
          import {resolve} from 'node:path'
          import {fetch,Client} from 'undici'
          import sharp from 'sharp'
          const require=createRequire(import.meta.url)
          assert.equal(require('undici/package.json').version,'7.29.1')
          assert.equal(require('fast-uri/package.json').version,'3.1.8')
          assert.equal(sharp.versions.sharp,'0.35.5')
          const uri=require('fast-uri')
          assert.equal(uri.equal('//%41.com','//a.com'),true)
          const Ajv=createRequire(resolve('node_modules/payload/package.json'))('ajv')
          const ajv=new Ajv()
          ajv.addSchema({$id:'https://example.org/definitions.json',definitions:{url:{type:'string',pattern:'^https://'}}})
          const valid=ajv.compile({$id:'https://example.org/schema.json',type:'object',properties:{url:{$ref:'./definitions.json#/definitions/url'}},required:['url']})
          assert.equal(valid({url:'https://example.com/path'}),true)
          assert.equal(valid({url:'unsafe value'}),false)
          const input=await sharp(Buffer.alloc(32*24*4,160),{raw:{width:32,height:24,channels:4}}).png().toBuffer()
          for(const type of ['jpeg','png','webp']){
            const data=await sharp(input)[type]().toBuffer()
            for(const [label,width,height] of [['thumbnail',400,300],['card',768,512],['hero',1280,720]]){
              const result=await sharp(data).resize(width,height,{fit:'cover'}).toBuffer()
              const m=await sharp(result).metadata()
              assert.equal(m.width,width,label)
              assert.equal(m.height,height,label)
            }
          }
          const server=http.createServer(async(req,res)=>{
            let body=''
            for await(const c of req)body+=c.toString()
            res.setHeader('content-type','text/plain')
            res.end(req.method+':'+req.url+':'+body)
          })
          server.listen(0,'127.0.0.1')
          await once(server,'listening')
          const url='http://127.0.0.1:'+server.address().port
          try{
            const g=await fetch(url+'/ping')
            assert.equal(await g.text(),'GET:/ping:')
            const p=await fetch(url+'/submit',{method:'POST',body:'test-only'})
            assert.equal(await p.text(),'POST:/submit:test-only')
            const client=new Client(url)
            try{
              const c=await client.request({path:'/direct',method:'GET'})
              assert.equal(await c.body.text(),'GET:/direct:')
            }finally{await client.close()}
          }finally{
            server.close()
            await once(server,'close')
          }
          console.log('COMBINED_SMOKE_OK: undici fetch/Client, Payload AJV, 9 sharp resize cases')
          NODE
      - name: Prepare PostgreSQL roles and migrate temporary database
        env:
          PAYLOAD_DB_PUSH: "false"
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg'
          const c=new pg.Client({connectionString:process.env.DATABASE_URL})
          await c.connect()
          await c.query(`DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END $$;`)
          await c.end()
          NODE
          npm run db:migrate:up
          npx tsx scripts/ci/assert-migration-complete.ts
      - name: Differential npm production audit with combined patches
        run: |
          npm audit --omit=dev --json > /tmp/combined-audit.json || test "$?" -eq 1
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {readFileSync} from 'node:fs'
          const audit=JSON.parse(readFileSync('/tmp/combined-audit.json','utf8'))
          const counts=audit.metadata?.vulnerabilities
          assert.ok(counts,'npm audit did not produce vulnerability metadata')
          console.log('COMBINED_PRODUCTION_AUDIT',JSON.stringify(counts))
          for(const pkg of ['undici','payload','fast-uri','sharp']){
            assert.equal(audit.vulnerabilities?.[pkg],undefined,'Unresolved advisory: '+pkg)
          }
          assert.equal(counts.critical,0)
          assert.ok(counts.total<=20,'Combined remediation failed expected 23 to <=20 reduction')
          NODE
      - name: Lint with combined patches
        run: npm run lint
      - name: Full integration suite with combined patches
        run: npm run test:int
      - name: Production-mode build with combined patches (no deployment)
        run: npm run build
      - name: Verify npm-generated manifest diff and save ONLY to security remediation branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: security/undici-fasturi-remediation-20261013
          EXPECTED_BASE: 11da8ee1a4841bcf248572c7ec28d3ec1245d12f
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {readFileSync,writeFileSync} from 'node:fs'
          import {execFileSync} from 'node:child_process'
          const originalText=execFileSync('git',['show','HEAD:package.json'],{encoding:'utf8'})
          const original=JSON.parse(originalText)
          const observed=JSON.parse(readFileSync('package.json','utf8'))
          const patch={undici:'7.29.1','fast-uri':'3.1.8'}
          assert.equal(original.dependencies.sharp,'0.35.5')
          assert.equal(original.dependencies.payload,'3.90.2')
          assert.equal(original.overrides,undefined)
          assert.deepEqual(observed,{...original,overrides:patch},'npm modified unrelated package.json fields')
          const clean=originalText.trimEnd()
          const last=clean.lastIndexOf('\n}')
          assert.ok(last>0,'Unexpected package.json format')
          const compact=clean.slice(0,last)+',\n  "overrides": {\n    "undici": "7.29.1",\n    "fast-uri": "3.1.8"\n  }\n}\n'
          assert.deepEqual(JSON.parse(compact),observed)
          writeFileSync('package.json',compact)
          const before=JSON.parse(execFileSync('git',['show','HEAD:package-lock.json'],{encoding:'utf8'}))
          const after=JSON.parse(readFileSync('package-lock.json','utf8'))
          const paths=[...new Set([...Object.keys(before.packages),...Object.keys(after.packages)])]
          const changed=paths.filter(p=>JSON.stringify(before.packages[p])!==JSON.stringify(after.packages[p]))
          console.log('LOCK_CHANGED_NODES',JSON.stringify(changed))
          assert.deepEqual(changed.filter(p=>!['','node_modules/undici','node_modules/fast-uri'].includes(p)),[],'Unexpected unrelated lockfile changes')
          assert.equal(after.packages['node_modules/undici']?.version,'7.29.1')
          assert.equal(after.packages['node_modules/fast-uri']?.version,'3.1.8')
          assert.equal(after.packages['node_modules/sharp']?.version,'0.35.5')
          assert.equal(after.packages['node_modules/payload']?.version,'3.90.2')
          console.log('REMEDIATION_DIFF_VALIDATED: only npm-generated undici+fast-uri lock changes')
          NODE
          git fetch --no-tags origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_BASE"
          git worktree add --detach "$RUNNER_TEMP/remediation" "$EXPECTED_BASE"
          cp package.json package-lock.json "$RUNNER_TEMP/remediation/"
          git -C "$RUNNER_TEMP/remediation" add -- package.json package-lock.json
          test "$(git -C "$RUNNER_TEMP/remediation" diff --cached --name-only | wc -l)" -eq 2
          git -C "$RUNNER_TEMP/remediation" diff --cached --name-only
          git -C "$RUNNER_TEMP/remediation" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(security): override undici 7.29.1 and fast-uri 3.1.8"
          gh auth setup-git
          git -C "$RUNNER_TEMP/remediation" push origin "HEAD:refs/heads/$TARGET"

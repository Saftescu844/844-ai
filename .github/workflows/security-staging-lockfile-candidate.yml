name: Security Staging Lockfile Candidate (temporary)

on:
  pull_request:
    branches: [staging]

permissions:
  contents: write

jobs:
  lockfile-candidate:
    if: github.head_ref == 'security/draft-staging-core-dependency-updates-20261016' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - name: Generate candidate lockfile (no lifecycle scripts)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Refresh brace-expansion within compatible ranges
        run: npm update brace-expansion --package-lock-only --ignore-scripts --no-save --no-audit --no-fund
      - name: Verify lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read-only security report
        run: |
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node scripts/ci/report-npm-audit.mjs "$RUNNER_TEMP/audit.json" all
      - name: Commit lockfile exclusively to its Draft branch
        env:
          APPROVED_BRANCH: security/draft-staging-core-dependency-updates-20261016
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "$APPROVED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(security): regenerate staging dependency lockfile"
            git push origin "HEAD:refs/heads/$APPROVED_BRANCH"
          fi

name: CI

on:
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      PAYLOAD_DB_PUSH: "false"

      # CI-only placeholders. This workflow must not depend on staging or
      # production secrets and must not connect to real external services.
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci"
      PAYLOAD_SECRET: "ci-only-placeholder-secret-not-for-runtime"
      MEDIA_PUBLIC_BASE_URL: "https://example.invalid/media"
      S3_BUCKET: "ci-only"
      S3_ACCESS_KEY_ID: "ci-only"
      S3_SECRET_ACCESS_KEY: "ci-only"
      S3_REGION: "eu-central-1"
      S3_ENDPOINT: "https://example.invalid"
      SITE_URL: "https://example.invalid"
      BREVO_API_KEY: "ci-not-used"
      ANTHROPIC_API_KEY: "ci-not-used"
      OPENAI_API_KEY: "ci-not-used"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Integration tests
        run: npm run test:int

      - name: Production build
        run: npm run build

name: Dependency audit (read-only)

on:
  pull_request:
    branches:
      - staging
    paths:
      - .github/workflows/dependency-audit-readonly.yml
      - scripts/ci/summarize-npm-audit.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: Report vulnerabilities (no fixes)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout without saved credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Match Railway Node version
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"

      - name: Match Railway npm major (runner only)
        run: npm install --global npm@11 --ignore-scripts --no-audit --no-fund

      - name: Compare committed and freshly resolved dependency graphs
        shell: bash
        run: |
          mkdir -p audit/resolved
          node --version > audit/node-version.txt
          npm --version > audit/npm-version.txt

          # Work only on temporary copies inside the ephemeral CI runner.
          # This models Railway's npm install dependency resolution without
          # installing project dependencies or executing lifecycle scripts.
          cp package.json package-lock.json audit/resolved/
          (
            cd audit/resolved
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          )

          # npm audit exits 1 on findings; preserve all raw JSON responses.
          set +e
          npm audit --json > audit/all.json
          locked_all_exit=$?
          npm audit --omit=dev --json > audit/production-graph.json
          locked_production_exit=$?
          (
            cd audit/resolved
            npm audit --json > ../resolved-all.json
          )
          resolved_all_exit=$?
          (
            cd audit/resolved
            npm audit --omit=dev --json > ../resolved-production-graph.json
          )
          resolved_production_exit=$?
          set -e

          printf 'locked-all=%s\nlocked-production=%s\nresolved-all=%s\nresolved-production=%s\n' \
            "$locked_all_exit" "$locked_production_exit" \
            "$resolved_all_exit" "$resolved_production_exit" > audit/exit-codes.txt

          node scripts/ci/summarize-npm-audit.mjs

      - name: Preserve audit evidence even if the registry fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: audit/
          if-no-files-found: warn
          retention-days: 14

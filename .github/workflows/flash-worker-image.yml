name: Flash worker image

on:
  pull_request:
    branches: [main, staging]
    paths:
      - Dockerfile.flash-engine-worker
      - Dockerfile.flash-engine-worker.dockerignore
      - package.json
      - package-lock.json
      - .npmrc
      - scripts/flash-rss-production*.ts
      - src/lib/flash/ingestion/flashProductionSchedule*.ts
      - src/lib/flash/ingestion/flashProductionOneShotOutcome.ts
      - src/lib/flash/ingestion/researchArticleAdapters.ts
      - .github/workflows/flash-worker-image.yml

permissions:
  contents: read

jobs:
  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the actual worker image from the reviewed lockfile
        run: docker build -f Dockerfile.flash-engine-worker -t flash-worker:ci .
      - name: Import worker dependencies without network, credentials or job execution
        run: >-
          docker run --rm --network none --entrypoint node flash-worker:ci
          --import tsx --input-type=module
          -e 'await import("payload"); await import("parse5"); await import("sharp"); console.log("FLASH_WORKER_IMPORT_SMOKE_OK")'
      - name: Load the scheduled entry point without runtime credentials or job execution
        run: >-
          docker run --rm --network none --entrypoint node flash-worker:ci
          --import tsx scripts/flash-rss-production-scheduled.ts --help
      - name: Verify the bounded outcome protocol inside the actual image
        run: >-
          docker run --rm --network none --entrypoint node flash-worker:ci
          --import tsx --input-type=module
          -e 'import assert from "node:assert/strict"; const p = await import("./src/lib/flash/ingestion/flashProductionOneShotOutcome.ts"); for (const result of [{outcome:"pair_created"},{outcome:"skipped",reason:"event_identity_not_grounded"}]) assert.deepEqual(p.parseProductionOneShotOutcome(p.formatProductionOneShotOutcome(result)),result); assert.deepEqual(p.parseProductionOneShotOutcome(""),{outcome:"failed",reason:"terminal_outcome_missing"}); console.log("FLASH_WORKER_OUTCOME_PROTOCOL_OK")'
      - name: Load and complete empty preflight without network or credentials
        run: >-
          docker run --rm --network none --entrypoint node flash-worker:ci
          --import tsx --input-type=module
          -e 'import assert from "node:assert/strict"; const p = await import("./src/lib/flash/ingestion/flashProductionSchedulePrequalification.ts"); const r = await p.prequalifyProductionScheduleCandidates({candidates:[],plans:[],now:Date.now()}); assert.deepEqual(r.candidates,[]); assert.equal(r.checked,0); console.log("FLASH_WORKER_PREFLIGHT_OFFLINE_OK")'

name: One-time isolated restore verification

on:
  push:
    branches:
      - test/backup-restore-isolated-20261010

permissions:
  contents: read
  actions: read

jobs:
  restore-rehearsal:
    if: github.repository == 'Saftescu844/844-ai' && github.ref == 'refs/heads/test/backup-restore-isolated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: restore_rehearsal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: temporary-ci-rehearsal-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restore_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: temporary-ci-rehearsal-only
      PGDATABASE: restore_rehearsal

    steps:
      - name: Install matching PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Retrieve only encrypted backup artifact from successful run 96
        uses: actions/download-artifact@v4
        with:
          name: db-backup-38077059604
          path: encrypted-artifact
          repository: Saftescu844/844-ai
          run-id: 38077059604
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare disposable PostgreSQL 17 extensions
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/psql -X -v ON_ERROR_STOP=1 -q <<'SQL'
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp" WITH SCHEMA extensions;
          -- The fresh Docker PostgreSQL database contains public by default;
          -- the dump must recreate this schema without colliding with it.
          -- DROP is strictly limited to the disposable restore_rehearsal DB.
          DROP SCHEMA IF EXISTS public CASCADE;
          SQL
          echo "Disposable database and required PostgreSQL extensions prepared; default public schema cleared."

      - name: Restore real encrypted public schema without a plaintext dump
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "$BACKUP_ENCRYPTION_PASSPHRASE" ]]; then
            echo "::error::Encryption passphrase secret missing."
            exit 1
          fi
          mapfile -t encrypted_files < <(find encrypted-artifact -maxdepth 1 -type f -name 'backup_*.dump.enc')
          if [[ "${#encrypted_files[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one encrypted dump in the artifact."
            exit 1
          fi

          # Never persist a decrypted .dump or log article content. All plaintext
          # travels in-memory to the LOCAL disposable postgres service.
          # Preserve restore diagnostics only on ephemeral runner disk; do not upload.
          set +e
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE -in "${encrypted_files[0]}" 2>"$RUNNER_TEMP/restore-decrypt.stderr" | \
            /usr/lib/postgresql/17/bin/pg_restore --format=c --exit-on-error \
              --no-owner --no-acl --dbname=restore_rehearsal \
              2>"$RUNNER_TEMP/restore-pg.stderr"
          results=("${PIPESTATUS[@]}")
          set -e

          if [[ "${results[0]}" -ne 0 || "${results[1]}" -ne 0 ]]; then
            echo "::error::Isolated restore did not finish. decrypt_status=${results[0]}, pg_restore_status=${results[1]}."
            if grep -Eq 'schema .+ does not exist' "$RUNNER_TEMP/restore-pg.stderr"; then echo "::warning::Diagnostic: missing referenced schema."; fi
            if grep -Eq 'function .+ does not exist' "$RUNNER_TEMP/restore-pg.stderr"; then echo "::warning::Diagnostic: missing referenced function."; fi
            if grep -Eq 'role .+ does not exist' "$RUNNER_TEMP/restore-pg.stderr"; then echo "::warning::Diagnostic: missing referenced role."; fi
            if grep -Eq 'extension .+ is not available' "$RUNNER_TEMP/restore-pg.stderr"; then echo "::warning::Diagnostic: missing extension."; fi
            if grep -Eq 'already exists' "$RUNNER_TEMP/restore-pg.stderr"; then echo "::warning::Diagnostic: object already exists."; fi
            echo "Diagnostics are deliberately not printed or uploaded to avoid disclosure of source data."
            exit 1
          fi
          echo "Full encrypted-stream decryption and pg_restore completed successfully."

      - name: Check restored schema, business data and foreign keys
        run: |
          set -euo pipefail
          stats=$(/usr/lib/postgresql/17/bin/psql -X -A -t -v ON_ERROR_STOP=1 -c "
            SELECT
              (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='r')::int,
              (SELECT count(*) FROM public.articole)::int,
              (SELECT count(*) FROM public.articole WHERE _status::text='published')::int,
              (SELECT count(*) FROM public.flash_ai)::int,
              (SELECT count(*) FROM public.payload_migrations)::int,
              (SELECT count(*) FROM pg_constraint con JOIN pg_namespace n ON n.oid=con.connamespace WHERE n.nspname='public' AND con.contype='f')::int,
              (SELECT count(*) FROM pg_constraint con JOIN pg_namespace n ON n.oid=con.connamespace WHERE n.nspname='public' AND con.contype='f' AND NOT con.convalidated)::int;
          ")
          IFS='|' read -r tables articles published flash migrations foreign_keys invalid_keys <<< "$stats"
          printf 'Restored public tables: %s; editorial articles: %s (published: %s); Flash AI: %s; migrations: %s; FK constraints: %s (unvalidated: %s).\n' \
            "$tables" "$articles" "$published" "$flash" "$migrations" "$foreign_keys" "$invalid_keys"
          if [[ "$tables" -ne 83 || "$articles" -lt 990 || "$published" -lt 700 || "$flash" -ne 4 || "$migrations" -lt 23 || "$foreign_keys" -lt 130 || "$invalid_keys" -ne 0 ]]; then
            echo "::error::Restored data and schema do not meet recorded production baseline."
            exit 1
          fi
          echo "ISOLATED RESTORE PASS: real public-schema archive restored with data and validated FK structure."

      - name: Remove encrypted copy from runner working directory
        if: always()
        run: |
          rm -rf encrypted-artifact
          rm -f "$RUNNER_TEMP/restore-decrypt.stderr" "$RUNNER_TEMP/restore-pg.stderr"
          echo "Runner files cleaned. Temporary Postgres service is automatically destroyed."

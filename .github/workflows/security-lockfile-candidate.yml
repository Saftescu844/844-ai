name: Security Lockfile Candidate (PR only)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lockfile-candidate:
    name: lockfile-candidate
    if: github.event.pull_request.number == 259 && github.head_ref == 'security/draft-main-dependency-audit-node22-20261016' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed manifest
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - name: Regenerate lockfile WITHOUT installing packages or writing to repository
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Refresh brace-expansion within existing compatible ranges
        run: npm update brace-expansion --package-lock-only --ignore-scripts --no-save --no-audit --no-fund
      - name: Verify dependencies can be installed from generated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Collect remediation audit
        run: |
          npm audit --json > "$RUNNER_${{ runner.temp }}/candidate-audit.json" || true
          node scripts/ci/report-npm-audit.mjs "$RUNNER_TEMP/candidate-audit.json" all
      - name: Export candidate lockfile
        uses: actions/upload-artifact@v4
        with:
          name: candidate-lockfile-${{ github.sha }}
          path: |
            package.json
            package-lock.json
            TEMP/candidate-audit.json
          retention-days: 7

      - name: Commit generated lockfile ONLY to security Draft PR branch
        env:
          APPROVED_BRANCH: security/draft-main-dependency-audit-node22-20261016
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "$APPROVED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(security): generate audited lockfile from pinned manifest"
            git push origin "HEAD:refs/heads/$APPROVED_BRANCH"
          fi

name: Dependency Security Inventory (read-only)

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: security-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-inventory:
    name: dependency-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
      - name: Install lockfile dependencies (without lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit all dependencies
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/audit-all.json" || true
          node scripts/ci/report-npm-audit.mjs "$RUNNER_TEMP/audit-all.json" all
      - name: Audit production dependencies only
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-production.json" || true
          node scripts/ci/report-npm-audit.mjs "$RUNNER_TEMP/audit-production.json" production
      - name: Save raw audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-inventory-${{ github.sha }}
          path: |
            ${{ runner.temp }}/audit-all.json
            ${{ runner.temp }}/audit-production.json
          if-no-files-found: warn
          retention-days: 14

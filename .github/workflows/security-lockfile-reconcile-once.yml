name: Security lockfile reconciliation (temporary)

# Temporary workflow used only for the isolated security-remediation Draft PR.
# Remove this file as soon as package-lock.json is reconciled.
on:
  pull_request:
    branches: [staging]
    paths:
      - .github/workflows/security-lockfile-reconcile-once.yml
      - package.json

permissions:
  contents: write

concurrency:
  group: security-lockfile-reconcile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile lockfile on security branch only
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/security-next-payload-20261011' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout this PR branch (no other branch)
        uses: actions/checkout@v4
        with:
          ref: fix/security-next-payload-20261011
          fetch-depth: 1

      - name: Node.js 22 as in Railway
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"

      - name: npm 11 on isolated runner
        run: npm install --global npm@11 --ignore-scripts --no-audit --no-fund

      - name: Regenerate lockfile without running project scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate regenerated lockfile with npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Push package-lock.json only to this branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile was already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "build(security): reconcile audited npm lockfile"
          git push origin HEAD:refs/heads/fix/security-next-payload-20261011
